[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitcoin-search-attention"
version = "0.1.0"
description = "Event study of Bitcoin price peaks and Google search attention"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "matplotlib>=3.10,<4",
  "pandas>=2.3,<3",
  "pyarrow>=20,<22",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.4,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bitcoin_search_attention"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py313"
